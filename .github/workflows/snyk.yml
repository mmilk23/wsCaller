name: Snyk

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]
  schedule:
    - cron: "52 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    name: Scan dependencies
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@v1.0.0

      - name: Check Snyk token
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error::Configure the SNYK_TOKEN repository secret before running this workflow."
            exit 1
          fi

      - name: Run Snyk test
        id: snyk-test
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test --file=pom.xml --package-manager=maven --severity-threshold=high --sarif-file-output=snyk.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Snyk SARIF
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif

      - name: Monitor project in Snyk
        if: github.event_name == 'push'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --file=pom.xml --package-manager=maven

      - name: Fail on Snyk findings
        if: steps.snyk-test.outputs.exit_code != '0'
        run: exit 1
